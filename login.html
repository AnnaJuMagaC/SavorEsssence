<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Sabor e Saúde</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <div class="d-flex vh-100 bg-light justify-content-center align-items-center">
      <div class="row w-100 login-section d-flex justify-content-center align-items-center">

        <!-- Lado esquerdo: Login -->
        <div
          class="col-md-6 d-flex flex-column justify-content-center align-items-center bg-light text-center"
        >
          <img src="./img/SV (1).png" alt="Logo" class="logo rounded-circle" />

          <h4 class="fw-bold mb-1">SABOR E SAÚDE EM CADA CLIQUE!</h4>
          <small class="text-muted mb-4"
            >Conecte-se para explorar receitas que nutrem o corpo e agradam o
            paladar.</small
          >

          <div class="login-box w-100">
            <h5 class="fw-bold mb-3">FAÇA O SEU LOGIN</h5>
            <form>
              <div class="mb-3 text-start">
                <label for="email" class="form-label">E-Mail</label>
                <div class="input-group">
                  <span class="input-group-text"
                  ></span>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Digite seu e-mail"
                  />
                </div>
              </div>
              <div class="mb-3 text-start">
                <label for="senha" class="form-label">Senha</label>
                <div class="input-group">
                  <span class="input-group-text"
                    ><i class="bi bi-lock-fill"></i
                  ></span>
                  <input
                    type="password"
                    class="form-control"
                    id="senha"
                    placeholder="Digite sua senha"
                  />
                </div>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-login">
                  Faça Seu Login
                </button>
              </div>
            </form>
            <p class="mt-3 text-muted small">
              Nutra Seu Dia Com Escolhas Mais Saudáveis
            </p>
          </div>
        </div>

        <!-- Lado direito: Imagem -->
        <div class="col d-none d-md-block p-0 vh-100 overflow-hidden">
          <img
            src="./img/FrangoLeg.png"
            alt="Comida saudável"
            class="w-100 object-fit-cover"
            style="object-position: center -100px"
          />
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
