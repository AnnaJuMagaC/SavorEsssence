<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar Conta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid">
  <div class="row vh-100">
    
    <!-- Coluna esquerda: Formulário -->
    <div class="col-md-6 d-flex flex-column justify-content-center align-items-center text-center px-4">
      <img src="./img/SV.png" alt="Logo SU" style="width: 500px;" class="mb-3">

      <h4 class="fw-bold text-uppercase">Sabor e Saúde em Cada Clique!</h4>
      <p class="text-muted">Conecte-se para explorar receitas que nutrem o corpo e agradam o paladar.</p>

      <h5 class="text-success fw-bold mt-4 mb-3">FAÇA A CONTA</h5>

      <form class="w-100" style="max-width: 400px;">
        <div class="mb-3 text-start">
          <label for="usuario" class="form-label">Usuário</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" class="form-control" id="usuario" placeholder="Digite seu nome">
          </div>
        </div>

        <div class="mb-3 text-start">
          <label for="email" class="form-label">E-mail</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
            <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail">
          </div>
        </div>

        <div class="mb-4 text-start">
          <label for="senha" class="form-label">Senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control" id="senha" placeholder="Digite sua senha">
          </div>
        </div>

        <button type="submit" class="btn btn-success w-100">Criar Conta</button>
      </form>

      <p class="mt-3 text-muted">Nutra seu dia com escolhas mais saudáveis</p>
    </div>

    <!-- Coluna direita: Imagem -->
    <div class="col-md-6 d-none d-md-block p-0">
      <img src="./img/brocolis.jpg" alt="Imagem comida saudável" class="img-fluid h-100 w-100" style="object-fit: cover;">
    </div>

  </div>
</div>

</body>
</html>
