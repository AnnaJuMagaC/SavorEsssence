<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sabor e Saúde</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f5f5;
    }

    .container-fluid {
      height: 100vh;
    }

    .left-column {
      background-color: #fff;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .left-column h1 {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .left-column p {
      font-size: 0.9rem;
      color: #444;
      margin-bottom: 30px;
    }

    .form-group {
      position: relative;
      margin-bottom: 1rem;
    }

    .form-control {
      padding-left: 2.5rem;
      border-radius: 8px;
    }

    .form-icon {
      position: absolute;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      color: #2f4f4f;
    }

    .btn-custom {
      background-color: #3e6945;
      color: white;
      border-radius: 8px;
      width: 100%;
    }

    .btn-custom:hover {
      background-color: #305837;
    }

    .logo {
      width: 100px;
      margin-bottom: 20px;
    }

    .right-column {
      background-image: url('./img/brocolis.jpg'); /* Substitua pela sua imagem */
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="row h-100">
      
      <!-- Coluna da esquerda (formulário) -->
      <div class="col-md-6 left-column">
        <img src="./img/SV.png" alt="Logo" class="logo"> <!-- Substitua pelo seu logo -->
        <h1>SABOR E SAÚDE EM CADA CLIQUE!</h1>
        <p>Conecte-se para explorar receitas que nutrem o corpo e agradam o paladar.</p>

        <h5 class="text-success mb-4">FAÇA A CONTA</h5>

        <form style="max-width: 350px; width: 100%;">
          <div class="form-group">
            <span class="form-icon"><i class="bi bi-person-fill"></i></span>
            <input type="text" class="form-control" placeholder="Usuário">
          </div>

          <div class="form-group">
            <span class="form-icon"><i class="bi bi-envelope-fill"></i></span>
            <input type="email" class="form-control" placeholder="E-mail">
          </div>

          <div class="form-group">
            <span class="form-icon"><i class="bi bi-lock-fill"></i></span>
            <input type="password" class="form-control" placeholder="Senha">
          </div>

          <button type="submit" class="btn btn-custom mt-2">Criar Conta</button>
        </form>

        <p class="mt-3 text-muted" style="font-size: 0.85rem;">
          Nutra seu dia com escolhas mais saudáveis
        </p>
      </div>

      <!-- Coluna da direita (imagem) -->
      <div class="col-md-6 right-column d-none d-md-block"></div>
    </div>
  </div>
</body>
</html>
