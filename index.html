<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
      integrity="sha512-dPXYcDub/aeb08c63jRq/k6GaKccl256JQy/AnOq7CAnEZ9FzSL9wSbcZkMp4R26vBsMLFYH4kQ67/bbV8XaCQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>SavorÉssence</title>
</head>
<body>
    
    <!-- HEADER -->
    <header class="">
        <div class="d-flex justify-content-center align-items-center">
          <img
            class="d-none d-md-block"
            src="./img/anuncio.png"
            height="80px"
            alt="Banner promocional"
          />
          <img
            class="d-md-none d-block"
            src="./img/anuncio.png"
            height="40px"
            alt="Banner promocional"
          />
        </div>
  
        <!-- navbar -->
        <nav class="bg-white navbar flex-column navbar-expand-lg p-0">
          <div
            class="container-fluid w-100 d-flex flex-row flex-md-column align-items-center align-items-md-stretch p-0"
          >
            <button
              id="menu"
              class="navbar-toggler border-0"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav"
              aria-controls="navbarNav"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div
              class="d-flex justify-content-around gap-5 align-items-center"
              style="height: 70px"
            >
              <form class="d-md-none d-flex corTexto fs-3" role="search">
                <i class="bi bi-search"></i>
                <input
                  style="width: 200px"
                  class="border-0 corTexto"
                  type="text"
                  name=""
                  id=""
                  placeholder="Buscar"
                />
              </form>
              <form class="d-none d-md-flex corTexto fs-2" role="search">
                <i class="bi bi-search"></i>
                <input
                  class="border-0 corTexto"
                  type="text"
                  name=""
                  id=""
                  placeholder="Buscar"
                />
              </form>
              <a
                href="#"
                class="d-none d-md-block btn text-light rounded-pill px-4 corFundo"
                >Torne-Se Um Membro</a
              >
            </div>
            <a
              class="d-md-none nav-link corTexto fw-bold d-flex flex-column align-items-center text-nowrap p-1"
              href="#"
              ><i class="bi bi-person fs-2"></i> Cadastrar-se</a
            >
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul
                class="py-5 px-2 navbar-nav d-flex justify-content-around align-items-md-center align-items-start border border-1 border-start-0 border-end-0 border-black w-100"
                id="bordaNavBar"
              >
                <li class="nav-item">
                  <a class="nav-link corTexto fw-bold" href="#">Receitas</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link corTexto fw-bold" href="#">Membro</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link corTexto fw-bold" href="#">Área Infantil</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link corTexto fw-bold" href="#">Nossa História</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link corTexto fw-bold" href="#">Ajuda</a>
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link corTexto fw-bold d-flex align-items-center gap-2"
                    href="#"
                    ><i class="bi bi-book fs-3"></i> Meu Perfil</a
                  >
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link corTexto fw-bold d-flex align-items-center gap-2"
                    href="#"
                    ><i class="bi bi-person fs-3"></i> Entrar/Cadastrar-se</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </header>
  
      <!-- IMAGEM DECORATIVA ANTES DO TEXTO -->
  
      <img
        class="d-none d-md-block w-100 object-fit-cover"
        src="./img/Savor.png"
      />
      <img
        class="d-md-none d-block w-100 object-fit-cover"
        src="./img/SavorMobile.png"
      />
      
      <footer class="instagram">
        <p>FAÇA PARTE DA NOSSA COMUNIDADE, SIGA A</p>
        <h3>@Savoréssence</h3>
      </footer>
</body>
</html>
